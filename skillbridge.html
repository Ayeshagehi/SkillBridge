<html lang="en"><head><meta charset="utf-8">

<title>SkillBridge</title>

<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;padding:10px 18px;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.25rem;color:var(--pri);text-decoration:none}nav{display:flex;gap:2px;overflow-x:auto;flex:1}
nav a{color:var(--mut);text-decoration:none;padding:6px 10px;border-radius:8px;white-space:nowrap;font-weight:500}nav a:hover,nav a.on{background:var(--soft);color:var(--pri)}
main{max-width:1040px;margin:0 auto;padding:22px 18px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}.stats{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}

button.chip{cursor:pointer;opacity:.55}button.chip.on{opacity:1;background:var(--vio);color:#fff}.chip.sos{background:var(--warn);color:#fff}.chip.ok{background:var(--ok);color:#fff}.chip.g{background:var(--line);color:var(--mut)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:600 14px Inter,sans-serif;cursor:pointer}.btn:hover{background:var(--vio)}.btn.s{background:var(--soft);color:var(--pri)}.btn.d{background:var(--warn)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}label{font-weight:600;font-size:13px;display:block;margin:12px 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:130px}.mut{color:var(--mut);font-size:13px}.big{font:800 2rem "Bricolage Grotesque";color:var(--pri)}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--vio)}

.hero{padding:40px 0 10px}.hero p{max-width:560px;font-size:1.1rem;color:var(--mut)}.pill{font-size:12px;background:var(--soft);color:var(--pri);padding:3px 10px;border-radius:99px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--pri);color:#fff;padding:10px 18px;border-radius:12px;z-index:9}
.li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}
.auth{display:grid;grid-template-columns:1fr 1.1fr;gap:18px;align-items:start}@media(max-width:820px){.auth{grid-template-columns:1fr}}.aside{background:#0f1038;color:#ecebff;border-radius:16px;padding:28px}.aside p{color:#b4b3e0}.form{animation:fi .25s}@keyframes fi{from{opacity:0;transform:translateY(6px)}}.tabs a{flex:1;text-align:center;padding:8px;border-radius:10px;text-decoration:none;font-weight:600;color:var(--mut)}.tabs a.on{background:var(--soft);color:var(--pri)}.pw{position:relative}.pw .btn{position:absolute;right:4px;top:4px;padding:4px 9px}.sbar{height:6px;border-radius:9px;background:var(--line);margin-top:6px;overflow:hidden}.sbar i{display:block;height:100%;transition:width .2s}.er{color:var(--warn);font-size:13px;margin:4px 0}.av{width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:4px;display:inline-block}.ini{background:var(--vio);color:#fff;text-align:center;font-size:12px;line-height:22px}.menu{position:absolute;right:0;top:100%;margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;min-width:170px;z-index:8;padding:4px;display:block}.menu a,.menu button{display:block;padding:9px 14px;text-decoration:none;color:var(--ink);background:none;border:0;width:100%;text-align:left;font:inherit;cursor:pointer;border-radius:8px}.menu a:hover,.menu button:hover{background:var(--soft)}
.navy{background:#0f1038;color:#ecebff;border-radius:16px;padding:18px;margin-top:20px}.navy .card{background:#1a1b4d;border-color:#33357a;color:#ecebff}.navy .mut{color:#b4b3e0}.kpi{transition:transform .15s}.kpi:hover{transform:translateY(-3px)}
.sgw{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;margin-top:14px}@media(max-width:820px){.sgw{grid-template-columns:1fr}}.sgbox{position:relative;border-radius:14px;background:radial-gradient(circle at 50% 45%,#1d1b4d,#0b0a24);border:1px solid #2b2a4d;overflow:hidden}.sgbox svg{width:100%;height:min(70vh,560px);display:block;touch-action:none;cursor:grab}.sgbox text{fill:#e8e7ff;pointer-events:none}.sgctl{position:absolute;right:8px;top:8px;display:flex;gap:4px}.sgctl .btn{padding:4px 10px}.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:10px}.lg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}@keyframes pop{from{opacity:.3;stroke-width:12}}.sel{animation:pop .35s}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
const SK=["C++","Java","Python","DSA","React","SQL","CAD","Figma","Calculus","Physics","AI/ML"];
const CAT={CAD:"CAD",Figma:"Design",Calculus:"Academics",Physics:"Academics"},AVL={now:"Available now",evening:"Evenings",weekend:"Weekends"},AVR={now:0,evening:1,weekend:2};

const H=36e5,D=24*H,NOW=Date.now(),K="skillbridge-v1";
const U=(id,n,d,y,sk,av,bio,b,s0)=>({id,n,d,y,sk,av,bio,b,s0});
const seed=()=>({me:"u1",theme:"",users:[U("u1","Ayesha Khan","Computer Science","2nd year",["Python","Calculus"],"now","Learning DSA. Happy to help with Calculus.",20,2),U("u2","Rahul Verma","Computer Science","3rd year",["C++","DSA","Java"],"now","Competitive programmer who loves explaining recursion.",120,14),U("u3","Priya Nair","Information Technology","3rd year",["C++","Python","SQL","AI/ML"],"evening","Backend tinkerer. Debugs queries for fun.",90,9),U("u4","Arjun Mehta","Computer Science","4th year",["Java","React","SQL"],"weekend","Placement season survivor.",70,6),U("u5","Meera Iyer","Mechanical Engineering","2nd year",["CAD","Figma","Physics"],"now","Fusion 360 and Figma nerd.",60,5),U("u6","Karan Singh","Electrical Engineering","3rd year",["Calculus","Physics","Python"],"evening","Maths tutor for juniors.",40,3)],
doubts:[{id:"d1",title:"NullPointerException in my Spring service",desc:"Repository returns null only when two requests arrive together.",sk:["Java","SQL"],cat:"Coding",urg:"sos",mode:"Screen share",bounty:20,by:"u4",st:"open",ses:null,rev:null,t:NOW-2*H},{id:"d2",title:"Fusion 360 sketch will not fully constrain",desc:"Two arcs stay blue however I constrain them.",sk:["CAD"],cat:"CAD",urg:"normal",mode:"Screen share",bounty:10,by:"u6",st:"open",ses:null,rev:null,t:NOW-5*H},{id:"d3",title:"Figma auto-layout breaks on resize",desc:"Cards overflow when the frame shrinks.",sk:["Figma"],cat:"Design",urg:"normal",mode:"Chat",bounty:0,by:"u3",st:"open",ses:null,rev:null,t:NOW-9*H},{id:"d4",title:"Draw the recursion tree for Fibonacci",desc:"Could not see why it is exponential.",sk:["C++","DSA"],cat:"Coding",urg:"normal",mode:"Voice",bounty:10,by:"u1",st:"resolved",ses:{h:"u2",st:"done",start:NOW-3*D},rev:{r:5,c:"Made it click in ten minutes."},t:NOW-3*D}],
notes:[],tx:[{u:"u2",pts:25,why:"Resolved a doubt",t:NOW-4*D},{u:"u2",pts:30,why:"Resolved a doubt",t:NOW-3*D},{u:"u3",pts:20,why:"Resolved a doubt",t:NOW-2*D},{u:"u5",pts:15,why:"Resolved a doubt",t:NOW-D}]});
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S)S=seed();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const SEED2={doubts:[
{id:"d5",title:"Segfault when deleting a node in my linked list",desc:"Works for the head node, crashes for a middle one.",sk:["C++","DSA"],cat:"Coding",urg:"normal",mode:"Screen share",bounty:10,by:"u4",st:"open",ses:null,rev:null,t:NOW-40*6e4},
{id:"d6",title:"Pandas groupby returns NaN for some rows",desc:"Only rows with missing dates are affected.",sk:["Python"],cat:"Coding",urg:"normal",mode:"Chat",bounty:5,by:"u6",st:"open",ses:null,rev:null,t:NOW-6*H},
{id:"d7",title:"My neural net overfits after epoch 5",desc:"Training loss keeps falling but validation loss climbs.",sk:["AI/ML","Python"],cat:"Coding",urg:"normal",mode:"Voice",bounty:15,by:"u5",st:"open",ses:null,rev:null,t:NOW-12*H},
{id:"d8",title:"Pointers vs references in C++",desc:"I never know which one to pass to a swap function.",sk:["C++"],cat:"Coding",urg:"normal",mode:"Voice",bounty:5,by:"u4",st:"resolved",ses:{h:"u2",st:"done",start:NOW-2*D},rev:{r:5,c:"Cleared up the swap example."},t:NOW-2*D},
{id:"d9",title:"SQL join returns duplicate rows",desc:"Joining orders to customers doubles my totals.",sk:["SQL"],cat:"Coding",urg:"normal",mode:"Chat",bounty:0,by:"u1",st:"resolved",ses:{h:"u3",st:"done",start:NOW-D},rev:{r:4,c:"Good walkthrough of GROUP BY."},t:NOW-D},
{id:"d10",title:"Beam deflection formula does not match my textbook",desc:"My answer is off by a factor of two.",sk:["Physics"],cat:"Academics",urg:"normal",mode:"Voice",bounty:10,by:"u6",st:"resolved",ses:{h:"u5",st:"done",start:NOW-1.5*D},rev:{r:5,c:"Spotted my unit mistake straight away."},t:NOW-1.5*D}],
tx:[{u:"u2",pts:25,why:"Resolved: Draw the recursion tree for Fibonacci",t:NOW-3*D,sd:1},{u:"u2",pts:20,why:"Resolved: Pointers vs references in C++",t:NOW-2*D,sd:1},{u:"u3",pts:10,why:"Resolved: SQL join returns duplicate rows",t:NOW-D,sd:1},{u:"u5",pts:25,why:"Resolved: Beam deflection formula does not match my textbook",t:NOW-1.5*D,sd:1}],
notes:[{id:"sn1",to:"u2",x:"New match (100%): Segfault when deleting a node in my linked list",t:NOW-40*6e4,read:false},{id:"sn2",to:"u2",x:"You earned 20 karma for helping with “Pointers vs references in C++” (5★)",t:NOW-2*D,read:true},{id:"sn3",to:"u1",x:"Rahul Verma accepted your session for “Draw the recursion tree for Fibonacci”",t:NOW-3*D,read:true},{id:"sn4",to:"u3",x:"You earned 10 karma for helping with “SQL join returns duplicate rows” (4★)",t:NOW-D,read:true},{id:"sn5",to:"u5",x:"You earned 25 karma for helping with “Beam deflection formula does not match my textbook” (5★)",t:NOW-1.5*D,read:true}]};
function migrate(){if(S.v>=2)return;const ids=new Set(S.doubts.map(d=>d.id));SEED2.doubts.forEach(d=>ids.has(d.id)||S.doubts.push(d));S.tx=S.tx.filter(x=>x.why!=="Resolved a doubt"&&!x.sd).concat(SEED2.tx);S.notes=S.notes.filter(n=>!/^sn\d/.test(n.id)).concat(SEED2.notes).sort((a,b)=>b.t-a.t);S.v=2;save()}
migrate();
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),pad=n=>String(n).padStart(2,"0");
const user=id=>S.users.find(u=>u.id===id),dbt=id=>S.doubts.find(d=>d.id===id),me=()=>user(S.me);
const karma=u=>u.b+S.tx.filter(x=>x.u===u.id).reduce((a,x)=>a+x.pts,0),weekly=u=>S.tx.filter(x=>x.u===u.id&&NOW-x.t<7*D||x.u===u.id&&Date.now()-x.t<7*D).reduce((a,x)=>a+x.pts,0);
const sess=u=>u.s0+S.doubts.filter(d=>d.st==="resolved"&&d.ses.h===u.id&&d.t>NOW-1).length;
const ago=t=>{const m=Math.max(1,(Date.now()-t)/6e4|0);return m<60?m+"m ago":m<1440?(m/60|0)+"h ago":(m/1440|0)+"d ago"};
const push=(to,x)=>{S.notes.unshift({id:Date.now()+Math.random(),to,x,t:Date.now(),read:false})};
const toast=m=>{const e=$("#toast");e.textContent=m;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200)};
/* Matching engine: overlap% = matched required skills / required skills; rank by overlap, then availability, then karma */
const rank=d=>S.users.filter(u=>u.id!==d.by).map(u=>{const m=d.sk.filter(s=>u.sk.includes(s));return{u,m,x:d.sk.filter(s=>!m.includes(s)),p:d.sk.length?Math.round(m.length/d.sk.length*100):0}}).filter(r=>r.p>0).sort((a,b)=>b.p-a.p||AVR[a.u.av]-AVR[b.u.av]||karma(b.u)-karma(a.u));
const why=(r,d)=>`Knows ${r.m.join(" + ")} (${r.m.length} of ${d.sk.length} required)${r.x.length?"; missing "+r.x.join(", "):""}. ${AVL[r.u.av]}. ${karma(r.u)} karma.`;
const myMatch=d=>d.sk.length?Math.round(d.sk.filter(s=>me().sk.includes(s)).length/d.sk.length*100):0;
const chips=a=>a.map(s=>`<span class="chip">${esc(s)}</span>`).join("");
const stChip=d=>({open:'<span class="chip g">Open</span>',requested:'<span class="chip">Help offered</span>',active:'<span class="chip ok">In session</span>',resolved:'<span class="chip ok">Resolved</span>'}[d.st]||"");
const card=d=>`<div class="card dc ${d.urg==="sos"?"sos":""}" data-a="go" data-i="doubt-${d.id}"><div class="row" style="justify-content:space-between;gap:4px"><span>${d.urg==="sos"?'<span class="chip sos">SOS</span>':""}${stChip(d)}${smpD(d)?'<span class="chip g">Sample</span>':""}</span><span class="mut" style="flex:none;min-width:0">${ago(d.t)}</span></div><h3>${esc(d.title)}</h3><div class="mut">${esc(d.desc).slice(0,110)}</div><div>${chips(d.sk)}</div><div class="row mut" style="justify-content:space-between"><span>${esc(user(d.by).n)} · ${d.mode}</span><b style="flex:none;color:var(--vio)">+${10+d.bounty} karma</b></div></div>`;
const badges=u=>[sess(u)>=1&&"Mentor",sess(u)>=6&&"Bug Slayer",karma(u)>=150&&"Campus Hero",weekly(u)>=30&&"Weekly Star"].filter(Boolean).map(b=>`<span class="chip ok">${b}</span>`).join("");
const F={q:"",cat:"",sk:"",urg:"",sort:"new"};let P={t:"",d:"",sk:[],cat:"Coding",urg:"normal",mode:"Voice",b:0,edit:null};
const V={};
V.home=()=>{const res=S.doubts.filter(d=>d.st==="resolved"),top=[...S.users].sort((a,b)=>karma(b)-karma(a)).slice(0,3),pop=SK.map(s=>[s,S.doubts.filter(d=>d.sk.includes(s)).length]).sort((a,b)=>b[1]-a[1]).slice(0,3);
return`<section class="hero"><span class="pill">Demo mode · sample campus data saved in your browser</span><h1 style="margin-top:14px">Don’t stay stuck.<br>Find your people.</h1><p>Post a doubt, get matched with a student on your campus who already knows the answer, and solve it together in a focused 15-minute session.</p><div class="row" style="margin-top:20px;justify-content:flex-start"><button class="btn" data-a="demo" style="flex:none">Run Ayesha’s demo</button>${AU.uid?'<a class="btn s" href="#explore" style="flex:none;text-decoration:none">Explore doubts</a>':'<a class="btn s" href="#signup" style="flex:none;text-decoration:none">Create account</a>'}</div></section>
<h2>How it works</h2><div class="grid"><div class="card"><h3>1. Post</h3><p class="mut">Describe the bug or concept. We detect the skills you need.</p></div><div class="card"><h3>2. Match</h3><p class="mut">Helpers are ranked by real skill overlap and availability, with the reason shown.</p></div><div class="card"><h3>3. Solve</h3><p class="mut">Claim, accept, run a 15-minute timer, resolve, and earn karma.</p></div></div>
<h2>Knowledge impact</h2><div class="grid stats"><div class="card"><div class="big">${res.length}</div>doubts resolved</div><div class="card"><div class="big">${sum(sgStats().map(x=>x.dem))}</div>learners needing help</div><div class="card"><div class="big">${sum(sgStats().map(x=>x.sup))}</div>mentor skill listings</div><div class="card"><div class="big">${S.doubts.filter(d=>d.st!=="resolved").length}</div>open doubts</div></div><p class="mut">Totals include a seeded, anonymous demo cohort so the campus feels realistic. Doubts and students marked Sample are demo data; accounts you register stay separate.</p><p class="mut">Popular skills: ${pop.map(p=>p[0]+" ("+p[1]+")").join(", ")}</p>
<h2>Campus activity</h2><div class="card">${feed(6)}</div><h2>Open right now</h2><div class="grid">${S.doubts.filter(d=>d.st==="open").slice(0,3).map(card).join("")}</div><h2>Featured helpers</h2><div class="grid">${top.map(u=>peep(u)).join("")}</div>`};
const peep=u=>`<div class="card"><div class="row" style="justify-content:space-between"><h3>${esc(u.n)} ${smp(u)}</h3><b style="flex:none;color:var(--vio)">${karma(u)} karma</b></div><div class="mut">${u.d} · ${u.y}</div><p class="mut">${esc(u.bio)}</p><div>${chips(u.sk)}</div><div class="mut">${AVL[u.av]} · ${sess(u)} sessions</div><div>${badges(u)}</div></div>`;
V.dash=()=>{const u=me(),mine=S.doubts.filter(d=>d.by===u.id),act=S.doubts.filter(d=>d.ses&&(d.ses.h===u.id||d.by===u.id)&&["requested","accepted","active","done"].includes(d.ses.st)&&d.st!=="resolved"),rec=S.doubts.filter(d=>d.st==="open"&&d.by!==u.id&&myMatch(d)>0).sort((a,b)=>(b.urg==="sos")-(a.urg==="sos")||myMatch(b)-myMatch(a)),foot=[...new Set(S.doubts.filter(d=>d.by===u.id&&d.st==="resolved").flatMap(d=>d.sk))],sos=rec.filter(d=>d.urg==="sos")[0];

<div class="grid stats" style="margin-top:14px"><div class="card"><div class="big">${mine.filter(d=>d.st!=="resolved").length}</div>open doubts</div><div class="card"><div class="big">${mine.filter(d=>d.st==="resolved").length}</div>resolved</div><div class="card"><div class="big">${act.length}</div>active sessions</div><div class="card"><div class="big">${karma(u)}</div>karma points</div></div>
<h2>My sessions</h2><div class="grid">${act.map(card).join("")||'<p class="mut">No active sessions. Claim a doubt or post one.</p>'}</div>
<h2>Recommended for you</h2><div class="grid">${rec.map(card).join("")||'<p class="mut">No open doubts match your skills right now.</p>'}</div>

const opts=(a,v,blank)=>(blank?"<option value=''>Select</option>":"")+[...new Set([...a,v].filter(Boolean))].map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join("");

V.signup=()=>shell("signup",`<form data-form="signup" novalidate><label for="sn">Full name</label><input id="sn" autocomplete="name"><label for="se">College email</label><input id="se" type="email" autocomplete="email" placeholder="you@college.edu">${pwf("sp","Password","new-password")}<div class="sbar"><i id="sbi" style="width:0"></i></div><div class="mut" id="sbt" style="font-size:12px"></div>${pwf("sc","Confirm password","new-password")}<label for="scol">College or university</label><input id="scol"><div class="row"><div><label for="sd">Department</label><select id="sd">${opts(DEPTS,"",1)}</select></div><div><label for="sy">Academic year</label><select id="sy">${opts(YEARS,"",1)}</select></div></div><label for="sb">Short introduction (optional)</label><input id="sb" maxlength="280"><label for="si">Technical interests (optional, comma separated)</label><input id="si" placeholder="web dev, robotics"><label for="ph">Profile photo (optional)</label><input id="ph" type="file" accept="image/*"><div class="mut" id="phs"></div><label style="font-weight:500;margin-top:14px"><input id="sk2" type="checkbox" style="width:auto"> I agree to the Terms of Use and Privacy Policy</label><p><button class="btn" style="width:100%">Create account</button></p></form><p class="mut">Already registered? <a href="#login">Log in</a></p>`);
V.verify=()=>AU.pending?`<div class="card" style="max-width:520px;margin:0 auto"><h2 style="margin-top:0">Check your inbox</h2><p>We sent a verification link to <b>${esc(AU.pending.email)}</b>. Open it to activate your account, then you’ll set up your profile.</p>${mode()}<button class="btn s" data-a="resend">Resend verification email</button> ${SB?"":'<button class="btn" data-a="simver">Simulate clicking the verification link</button>'}<p class="mut"><a href="#login">Back to log in</a></p></div>`:'<p>No verification pending. <a href="#login">Log in</a></p>';
V.forgot=()=>shell("login",AU.sent?`<h3>Check your email</h3><p>If an account exists for that address, we’ve sent a link to reset the password.</p>${SB?"":'<button class="btn" data-a="simreset">Demo: open the simulated reset link</button>'}<p class="mut"><a href="#login">Back to log in</a></p>`:`<h3>Reset your password</h3><form data-form="forgot" novalidate><label for="fe">Registered email</label><input id="fe" type="email" autocomplete="email"><p><button class="btn" style="width:100%">Send reset link</button></p></form><p class="mut"><a href="#login">Back to log in</a></p>`);

const smp=u=>isS(u.id)?'<span class="chip g">Sample</span>':"",smpD=d=>/^d\d{1,2}$/.test(d.id);
